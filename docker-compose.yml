version: '3.8'

services:
  myka-server:
    build: .
    container_name: myka_ai_server
    restart: always
    ports:
      - "5000:5000" # WebSocket Port
      - "5001:5001" # WhatsApp Webhook Port
    env_file:
      - .env.production
    volumes:
      # Lưu lại thư mục audio_cache ra ngoài để không mất khi restart container
      - ./audio_cache:/app/audio_cache
      # Log lịch sử chat
      - ./chat_history.log:/app/chat_history.log
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - WS_PORT=5000
      - WEBHOOK_PORT=5001
